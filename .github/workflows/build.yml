name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - forge1_7_10
          - forge1_12_2
          - forge1_16_5
          - forge1_18_2
          - forge1_19_2
          - forge1_20_1
          - neo1_21_1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: coursier/cache-action@v8

      - name: Build
        shell: bash
        run: |
          ./mill "${{ matrix.platform }}.jar"
          version="$(tr -d '[:space:]' < version)"
          mv "out/${{ matrix.platform }}/jar.dest/out.jar" "realitylink-${{ matrix.platform }}-${version}.jar"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: RealityLink-${{ matrix.platform }}
          path: realitylink-${{ matrix.platform }}-*.jar
          if-no-files-found: error
