name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: coursier/cache-action@v8

      - name: Build
        run: ./mill _.jar

      - name: Collect
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < version)"
          targets="$(./mill show resolve _.jar | jq -r '.[]')"
          mkdir -p artifacts
          while IFS= read -r target; do
            platform="${target%.jar}"
            cp "out/${platform}/jar.dest/out.jar" "artifacts/realitylink-${platform}-${version}.jar"
          done <<< "$targets"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: RealityLink
          path: artifacts/*.jar
          if-no-files-found: error
